<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>套房電費管理系統</title>
  <script>
    // 盡早套用已儲存的深/淺色主題，避免畫面先閃一下淺色再變深色
    (function () {
      const saved = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="top-bar">
    <h1>🏠 套房電費管理系統</h1>
    <div class="top-bar-actions">
      <button type="button" class="btn-theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">🌙 深色</button>
      <a class="btn-link" href="admin.html">🔐 管理後台</a>
    </div>
  </div>

  <!-- 前台展示 -->
  <div class="card">
    <h2>⚡ 前台 - 電費用量統計</h2>
    <p id="meterDateLine" class="field-note" style="display:none;">📅 抄表日期：<span id="displayMeterDate"></span></p>
    <p id="waterDateLine" class="field-note" style="display:none;">💧 水費抄表日期：<span id="displayWaterDate"></span></p>
    <h3>總電表概況 (單價：<span id="displayUnitPrice">0</span> 元/度)</h3>
    <div class="grid">
      <div class="stat-box"><div>總使用度數</div><div class="stat-value"><span id="mainUsage">0</span> 度</div></div>
      <div class="stat-box"><div>總電費金額</div><div class="stat-value">$ <span id="mainAmount">0</span></div></div>
      <div class="stat-box"><div>水費均攤費用（每人）</div><div class="stat-value">$ <span id="waterPerPerson">0</span></div></div>
    </div>

    <h3>各套房用量明細</h3>
    <table>
      <thead>
        <tr>
          <th>房號</th>
          <th>上次度數</th>
          <th>本次度數</th>
          <th>使用度數</th>
          <th>應繳金額</th>
        </tr>
      </thead>
      <tbody id="tenantTableBody">
        <tr><td colspan="5">資料載入中...</td></tr>
      </tbody>
    </table>
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script>
    // 這個網站所在的 GitHub 位置。若你的訪客從未打開過 admin.html 設定過連線資訊，
    // 前台就會用這裡的預設值去讀取公開的 data.json（讀取公開檔案不需要 PAT）。
    // 請視你實際部署的帳號/專案/分支修改以下三個預設值。
    const DEFAULT_OWNER = 'leien08';
    const DEFAULT_REPO = 'billing_app';
    const DEFAULT_BRANCH = 'main';

    function fromBase64(str) {
      const binary = atob(str.replace(/\n/g, ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    function showStatus(text, isError = false) {
      const msg = document.getElementById('statusMsg');
      msg.innerText = text;
      msg.className = 'status-msg ' + (isError ? 'error' : 'success');
      msg.style.display = 'block';
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ---------- 深/淺色主題切換 ----------
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeToggleLabel();
    }

    function updateThemeToggleLabel() {
      const btn = document.getElementById('themeToggleBtn');
      if (!btn) return;
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      btn.innerText = current === 'dark' ? '☀️ 淺色' : '🌙 深色';
    }

    // ---------- 樓層分組（可收合）：房號如 "1-1"、"2-5" 依樓層數字自動分色與分組 ----------
    // 房號格式須為「樓層-戶號」（例如 1-1 ~ 1-10、2-1 ~ 2-10...），前面的數字視為樓層。
    // 色票共有 6 組，樓層數超過 6 會循環使用（例如 7 樓會沿用 1 樓的顏色）。
    // 房號不符合此格式的會歸在「其他」分組，一樣可收合，但不上色。
    let collapsedFloorGroups = new Set();

    function getFloorNumber(roomName) {
      const match = String(roomName).match(/^(\d+)-/);
      return match ? parseInt(match[1], 10) : null;
    }

    function groupRoomsByFloor(rooms) {
      const groups = new Map();
      rooms.forEach(room => {
        const floor = getFloorNumber(room.name);
        const key = floor !== null ? String(floor) : 'other';
        if (!groups.has(key)) {
          groups.set(key, { key, floor, colorIdx: floor !== null ? (floor - 1) % 6 : null, rooms: [] });
        }
        groups.get(key).rooms.push(room);
      });
      return Array.from(groups.values()).sort((a, b) => {
        if (a.key === 'other') return 1;
        if (b.key === 'other') return -1;
        return a.floor - b.floor;
      });
    }

    // 展開/收合某個樓層分組：直接切換該分組所有列的顯示狀態，不重新渲染整個表格
    function toggleFloorGroup(key, iconEl) {
      const nowCollapsed = !collapsedFloorGroups.has(key);
      if (nowCollapsed) collapsedFloorGroups.add(key);
      else collapsedFloorGroups.delete(key);
      document.querySelectorAll(`#tenantTableBody tr[data-group="${key}"]`).forEach(tr => {
        tr.style.display = nowCollapsed ? 'none' : '';
      });
      if (iconEl) iconEl.textContent = nowCollapsed ? '▶' : '▼';
    }

    async function loadPublicData() {
      // 若這台裝置曾經在 admin.html 登入過並設定過連線資訊，沿用該設定；否則使用預設值。
      const owner = localStorage.getItem('gh_owner') || DEFAULT_OWNER;
      const repo = localStorage.getItem('gh_repo') || DEFAULT_REPO;
      const branch = localStorage.getItem('gh_branch') || DEFAULT_BRANCH;

      const url = `https://api.github.com/repos/${owner}/${repo}/contents/data.json?ref=${branch}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}: 讀取失敗`);

        const fileData = await res.json();
        const jsonText = fromBase64(fileData.content);
        const data = JSON.parse(jsonText);
        renderPublicUI(data);
      } catch (err) {
        showStatus('資料讀取失敗：' + err.message, true);
        document.getElementById('tenantTableBody').innerHTML =
          '<tr><td colspan="5">資料讀取失敗，請稍後再試</td></tr>';
      }
    }

    function renderPublicUI(data) {
      const mainUsage = data.mainMeter.current - data.mainMeter.previous;
      document.getElementById('displayUnitPrice').innerText = data.unitPrice;
      document.getElementById('mainUsage').innerText = mainUsage >= 0 ? mainUsage : 0;
      document.getElementById('mainAmount').innerText = (mainUsage * data.unitPrice).toFixed(0);

      if (data.meterReadingDate) {
        document.getElementById('displayMeterDate').innerText = data.meterReadingDate;
        document.getElementById('meterDateLine').style.display = 'block';
      }

      const water = data.water || { totalAmount: 0, peopleCount: 1, readingDate: '' };
      const waterPerPerson = water.peopleCount > 0 ? water.totalAmount / water.peopleCount : 0;
      document.getElementById('waterPerPerson').innerText = waterPerPerson.toFixed(0);
      if (water.readingDate) {
        document.getElementById('displayWaterDate').innerText = water.readingDate;
        document.getElementById('waterDateLine').style.display = 'block';
      }

      const tenantBody = document.getElementById('tenantTableBody');
      tenantBody.innerHTML = '';
      const groups = groupRoomsByFloor(data.rooms);
      groups.forEach(g => {
        const collapsed = collapsedFloorGroups.has(g.key);
        const colorClass = g.colorIdx !== null ? `floor-${g.colorIdx}` : 'floor-none';
        const label = g.key === 'other' ? '其他' : `${g.floor} 樓`;

        tenantBody.innerHTML += `
          <tr class="floor-group-header ${colorClass}" onclick="toggleFloorGroup('${g.key}', this.querySelector('.floor-toggle-icon'))">
            <td colspan="5"><span class="floor-toggle-icon">${collapsed ? '▶' : '▼'}</span> <strong>${label}</strong>　(${g.rooms.length} 間)</td>
          </tr>
        `;

        g.rooms.forEach(room => {
          const usage = room.current - room.previous;
          const amount = usage * data.unitPrice;
          const hiddenStyle = collapsed ? ' style="display:none;"' : '';
          tenantBody.innerHTML += `
            <tr class="${colorClass}" data-group="${g.key}"${hiddenStyle}>
              <td>${escapeHtml(room.name)}</td>
              <td>${room.previous}</td>
              <td>${room.current}</td>
              <td>${usage >= 0 ? usage : 0} 度</td>
              <td><strong>$ ${amount >= 0 ? amount.toFixed(0) : 0}</strong></td>
            </tr>
          `;
        });
      });
    }

    window.onload = () => {
      updateThemeToggleLabel();
      loadPublicData();
    };
  </script>
</body>
</html>
